<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Userform</legend>
            <label for="color">Choose color</label>
            <input type="color" id="color" name="color"><br><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Please Enter Email" required><br><br>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter Password" required><br><br>
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="14" max="50" placeholder="age" required><br><br>
            
            <input type="hidden" id="hidden" name="hidden" value="123"><br><br>
            <button type="submit">Send</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
