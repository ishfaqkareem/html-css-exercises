<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        .box1{
            width: 500px;
            height: 500px;
            border: 2px black solid;
            margin: auto;
            position: relative;
        }
        .sun{
            width: 100px;
            height: 100px;
            border: 2px rgb(195, 205, 50) solid;
            background-color: yellow;
            border-radius: 50%;
            position: absolute;
            top: 0px;
            left: 0px;
            animation-name: sun;
            animation-duration: 5s;
            animation-delay: 2s;
        }
        @keyframes sun {
            0%{
               top: 0px;
            left: 0px; 
            }
            25%{
               top: 0px;
            left: 396px; 
            }
            50%{
               top: 396px;
            left: 396px; 
            }
            75%{
               top: 396px;
            left: 0px; 
            }
        }
    </style>
</head>
<body>
    <div class="box1">
        <div class="sun"></div>
    </div>
</body>
</html>
