<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display grid</title>
    <style>
        .box{
            width: 500px;
            height:500px;
            border: 2px black solid;
            margin: auto;
            margin-top: 50px;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-column-gap: 10px;
            grid-row-gap: 10px;
            padding: 20px;
        }
        .box div{
            background-color: green;
            border: black 1px solid;
            text-align: center;
        

            /* border: 1px green solid; */
        }
    </style>
</head>
<body>
    <div class="box">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>
</body>
</html>
