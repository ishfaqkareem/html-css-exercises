<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Calendar</legend>
            <label for="date">Date:</label>
            <input type="date" id="date" name="date"><br/><br/>
            <label for="datetime">Date time:</label>
            <input type="datetime-local" id="datetime" name="datetime"><br/><br/>
            <label for="time">Time:</label>
            <input type="time" id="time" name="time"><br/><br/>
            <label for="month">Month:</label>
            <input type="month" id="month" name="month"><br/><br/>
            <label for="week">Week:</label>
            <input type="week" id="week" name="week"><br/><br/>
            <label for="range">Range:</label>
            <input type="range" id="range" name="range" min="0" max="100" value="47"><br/><br/>
            <button type="submit">Send</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
