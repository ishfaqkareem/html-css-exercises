<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Website</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    .container{
      max-width: 1200px;
      margin: auto;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    /* Header */

    .header{
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1{
      font-size: 40px;
      margin-bottom: 10px;
    }

    .header p{
      font-size: 18px;
    }

    /* Navbar */

    .navbar{
      display: flex;
      justify-content: center;
      background: #222;
      flex-wrap: wrap;
    }

    .navbar a{
      color: white;
      text-decoration: none;
      padding: 15px 25px;
      transition: 0.3s;
    }

    .navbar a:hover{
      background: #2575fc;
    }

    /* Hero Section */

    .hero{
      display: flex;
      flex-wrap: wrap;
    }

    .sidebar{
      flex: 1;
      min-width: 250px;
      background: #6a11cb;
      color: white;
    }

    .sidebar ul{
      list-style: none;
    }

    .sidebar ul li{
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      transition: 0.3s;
      cursor: pointer;
    }

    .sidebar ul li:hover{
      background: rgba(255,255,255,0.2);
    }

    .hero-image{
      flex: 3;
      min-width: 300px;
    }

    .hero-image img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Clients Section */

    .clients{
      padding: 40px 20px;
      text-align: center;
      background: #f9f9f9;
    }

    .clients h2{
      margin-bottom: 30px;
      font-size: 32px;
      color: #333;
    }

    .client-boxes{
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .client{
      flex: 1 1 250px;
      max-width: 300px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .client:hover{
      transform: translateY(-5px);
    }

    .client img{
      width: 100%;
      display: block;
    }

    /* Footer */

    .footer{
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .footer a{
      color: #00bfff;
      text-decoration: none;
      margin: 0 10px;
    }

    .footer a:hover{
      text-decoration: underline;
    }

    /* Responsive */

    @media(max-width: 768px){

      .header h1{
        font-size: 28px;
      }

      .navbar{
        flex-direction: column;
      }

      .hero{
        flex-direction: column;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- Header -->

    <div class="header">
      <h1>Welcome To Ishfaq Programming</h1>
      <p>Modern Responsive Website Design</p>
    </div>

    <!-- Navbar -->

    <div class="navbar">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Courses</a>
      <a href="#">Gallery</a>
      <a href="#">Contact</a>
    </div>

    <!-- Hero Section -->

    <div class="hero">

      <!-- Sidebar -->

      <div class="sidebar">
        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Courses</li>
          <li>Gallery</li>
          <li>Contact Us</li>
        </ul>
      </div>

      <!-- Main Image -->

      <div class="hero-image">
        <img src="..\images\18.jpg" alt="Website Banner">
      </div>

    </div>

    <!-- Clients Section -->

    <div class="clients">

      <h2>Our Clients</h2>

      <div class="client-boxes">

        <div class="client">
          <img src="..\images\18.png" alt="Client">
        </div>

        <div class="client">
          <img src="..\images\18.png" alt="Client">
        </div>

        <div class="client">
          <img src="..\ASSETS\images\18.png" alt="Client">
        </div>

      </div>

    </div>

    <!-- Footer -->

    <div class="footer">
      <a href="#">Home</a> |
      <a href="#">About</a> |
      <a href="#">Courses</a> |
      <a href="#">Gallery</a> |
      <a href="#">Contact</a>
    </div>

  </div>

</body>
</html>
