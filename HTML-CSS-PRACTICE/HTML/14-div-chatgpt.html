<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Div Layout</title>

<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .main {
        width: 500px;
        height: 500px;
        background-color: rgb(255, 0, 55);
        display: flex;
        flex-direction: column;
    }

    .row1, .row2 {
        display: flex;
        height: 50%;
    }

    .box {
        width: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
        color: white;
    }

    .home { background: bisque; color: black; }
    .about { background: rgb(146, 15, 103); }
    .course { background: rgb(212, 120, 7); }
    .gallery { background: rgb(64, 10, 100); }
</style>

</head>

<body>

<div class="main">

    <div class="row1">
        <div class="box home">Home</div>
        <div class="box about">About</div>
    </div>

    <div class="row2">
        <div class="box course">Course</div>
        <div class="box gallery">Gallery</div>
    </div>

</div>

</body>
</html>
