<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h2>Enquiry</h2>
    <form action="">
        <fieldset>
            <legend>Enquiry</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your Name"/><br/><br/>
        <label for="address">Address:</label>
        <textarea id="address" name="address"></textarea><br/><br/>
        <label>Gender</label><br><br>
        <input type="radio" name="gender" value="m" id="male" checked/> <label for="male">Male</label> 
        <input type="radio" name="gender" value="f" id="female"/> <label for="female">Female</label>
        <input type="radio" name="gender" value="o" id="other"/> <label for="other">Other</label>
        <br/><br/>
        <label for="country">Country:</label>
        
        <select name="country" id="country">
            <option value="">Please Select Country</option>
            <optgroup label="Asia">
                <option value="Pakistan">Pakistan</option>
                <option value="India">India</option>
                <option value="Sri lanka">Sri lanka</option>
                <option value="Bangladesh">Bangladesh</option>
            </optgroup>
            <option value="USA">USA</option>
            <option value="Australia">Australia</option>
        </select>
        <br/><br/>
        <label>Hobbies</label>
        <input type="checkbox" name="hobbies" value="Cricket" id="cricket" /><label for="cricket">Cricket</label> 
        <input type="checkbox" name="hobbies" value="Dancing" id="dancing" /><label for="dancing">Dancing</label> 
        <input type="checkbox" name="hobbies" value="Reading" id="reading" /><label for="reading">Reading</label> 
        <br/><br/>
        <label for="image">Image</label>
        <input type="file" id="image" name="image">
        <br/><br/>
        <button type="submit">Send</button>
        <button type="reset">Reset</button>
        </fieldset>
    </form>
    
</body>
</html>
