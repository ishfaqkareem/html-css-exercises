<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boxshadow</title>
    <style>

        .box{
            width: 500px;
            height: 500px;
            border: 2px solid black;
            margin: auto;
            background-color: rgb(0, 250, 35);
            background-color: rgba(155, 29, 7, 0.534);
            font-size: 100px;
            color: white;
            /* box-shadow: x-axis |y-axis |blur | range | color name; */
            box-shadow: 5px 10px 20px 5px  grey;
        }
        </style>
</head>
<body>
    <div class="box">Code with Ishfaq</div>
</body>
</html>
