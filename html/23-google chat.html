<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>

    <style>
        .map-container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        iframe {
            width: 100%;
            height: 300px;
            border: 0;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Find Us on Map</h2>

    <div class="map-container">

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3475.721209856933!2d70.8686870752529!3d29.407710648458504!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjnCsDI0JzI3LjciTiA3MMKwNTInMTYuNSJF!5e0!3m2!1sen!2s!4v1779332730673!5m2!1sen!2s"
            allowfullscreen
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>

    </div>

</body>
</html>
