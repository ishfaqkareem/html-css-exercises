<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text shadow</title>
    <style>
        .text{
            text-align: center;
            margin-top: 40px;
            font-size: 100px;
            text-transform: capitalize;
            text-shadow: 5px -5px 10px rgb(0, 200, 200);
            /* box-shadow: x-axis |y-axis |blur | range | color name; */
        }
    </style>
</head>
<body>
    <div>
        <h1 class="text">Welcome to code with ishfaq</h1>
    </div>
</body>
</html>
