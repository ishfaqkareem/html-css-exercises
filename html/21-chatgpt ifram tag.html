<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video iframe</title>

    <style>
        .video-container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        iframe {
            width: 100%;
            height: 315px;
            border: 1px solid red;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div>
        <h2>Hi, watch my YouTube video</h2>
    </div>

    <div class="video-container">

        <iframe
            src="https://www.youtube.com/embed/vMXg4V-fKGw"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </div>

</body>
</html>
