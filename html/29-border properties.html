<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border properties</title>
    <style>
        .m {
            width: 200px;
            height: 200px;
            border: 5px blueviolet solid;
            /* margin-bottom: 10px; */
            margin: 20px 50px 50px 50px;
        }

        .code {
            width: 100px;
            height: 100px;
            border-bottom: 5px blueviolet double;
            border-top: 10px maroon solid;
            border-right: 4px green solid;
            border-left: 5px purple solid;
            /* margin-left: 50px; */
            /* margin: 20px 50px 50px 50px; */
        }
    </style>
</head>

<body>
    <div class="m">
        My name Is Muhammad Ishfaq
        <div class="code">code with Ishfaq </div>
    </div>
</body>

</html>
