<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Page</title>
    <style>
        .main{
            max-width:1000px;
            width: 100%;
            height: 640px;
            background-color: blueviolet;
            font-family: Arial, Helvetica, sans-serif;
            margin: auto;
            text-align: center;
        }
        .row1{
            height: 100px;
            background-color: rgb(61, 117, 8);
            text-transform: uppercase;
        }
        .row2{
            height: 40px;
            background-color: brown;
        }
        .row2col1, .row2col2, .row2col3, .row2col4, .row2col5{
            width: 200px;
            height: 40px;
            background-color: aquamarine;
            float: left;
            line-height: 40px;
        }
        .row2col1:hover, .row2col2:hover, .row2col3:hover, .row2col4:hover, .row2col5:hover{
            background-color: rgb(12, 161, 75);
        }
        .row3{
            height: 200px;
            background-color:rgb(0, 110, 255) ;
        }
        .row3col1{
            width: 250px;
            height: 200px;
            background-color: rgb(84, 55, 110);
            float: left;
        }
        .row3col1row1, .row3col1row2, .row3col1row3, .row3col1row4, .row3col1row5{
            height: 40px;

        }
        .row3col1row1:hover, .row3col1row2:hover, .row3col1row3:hover, .row3col1row4:hover, .row3col1row5:hover{
            background-color: rgba(0, 0, 0, .1);
        }
        .row3col2{
            width: 750px;
            height: 200px;
            background-color:yellowgreen;
            float: right;
        }
        .row3col2:hover{
            opacity: 0.9;
        }
        .row4{
            height: 150px;
            background-color: rgb(152, 152, 189);
        }
        .row4:hover{
            opacity: 0.7;
        }
        .row5{
            height: 100px;
            background-color: rgb(88, 231, 231);
        }
        .row5col1, .row5col2, .row5col3{
            width: 333.33px;
            height: 100px;
            background-color: brown;
            float: left;
        }
        .row5col1:hover, .row5col2:hover, .row5col3:hover{
           
            opacity: 0.9;
        }
        .row6{
            width: 100%;
            height: 50px;
            background-color: rgba(71, 36, 117, 0.459);
        }
        .row6:hover{
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="row1">Welcome To Ishfaq Programming</div>
        <div class="row2">
            <div class="row2col1">Home</div>
            <div class="row2col2">About</div>
            <div class="row2col3">Course</div>
            <div class="row2col4">Gallery</div>
            <div class="row2col5">Contact us</div>
        </div>
        <div>
            <div class="row3">
                <div class="row3col1">
                    <div class="row3col1row1">Home</div>
                    <div class="row3col1row2">About</div>
                    <div class="row3col1row3">Course</div>
                    <div class="row3col1row4">Gallery</div>
                    <div class="row3col1row5">Contact us</div>
                </div>
                <div class="row3col2"><img src="18.png" alt="no img" width="100%" height="100%"></div>
            </div>
        </div>
        <div class="row4">our client</div>
        <div class="row5">
            <div class="row5col1"><img src="18.png" alt="No Img" width="100%" height="100%"></div>
            <div class="row5col2"><img src="18.jpg" alt="No Img" width="100%" height="100%"></div>
            <div class="row5col3"><img src="18.png" alt="No Img" width="100%" height="100%"></div>
       </div>
       <div class="row6">Home | About | Course | Gallery | Contact Us</div>

    </div>
</body>
</html>
