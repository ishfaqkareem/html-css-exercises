<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        .box1{
            width: 200px;
            height: 200px;
            border: 2px black solid;
            float: left;
            font-size: 50px;
            text-align: center;
            background-color: blueviolet;
        }
        .box2{
            width: 200px;
            height: 200px;
            border: 2px black solid;
            float: left;
            font-size: 50px;
            text-align: center;
            /* position: absolute;
            apni position  chor deta hy is ko move kia ja skta hy
            position: relative 
            yh apni jagha ni chorta is ko move kia ja skta hy yh apni jagha ko he apna parent concider krta hy
            */
            /* position:absolute; */
            position: relative;
            top: 200px;
            left: 100px;
            background-color: aquamarine;
        }.box3{
            width: 200px;
            height: 200px;
            border: 2px black solid;
            float: left;
            font-size: 50px;
            text-align: center;
            background-color: brown;
        }
    </style>
</head>
<body>
    <div class="box1"><h1>1</h1></div>
    <div class="box2"><h1>2</h1></div>
    <div class="box3"><h1>3</h1></div>
</body>
</html>
