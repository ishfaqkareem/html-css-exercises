<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table attributes</title>
</head>
<body>
    <h2>table</h2>
    <h3>bgcolor,align,cellspacing,cellpadding,width,height</h3>
    <h2>tr</h2>
    <h3>bgcolor,align</h3>
    <h2>th,td</h2>
    <h3>bgcolor,rowspan,colspan</h3>
    <table border="2px" align="center" width="400px" height="400px" bgcolor="pink" cellspacing="10px" cellpadding="10px">
        <thead>
            <tr>
            <th>Course</th>
            <th>Fees</th>
            <th>Duration</th>
            </tr>
        </thead>
            <tbody>
                <tr bgcolor="green" align="center">
                    <td bgcolor="blue">HTML</td>
                    <td>5000</td>
                    <td>2 Months</td>
                </tr>
                <tr>
                    <td>CSS</td>
                    <td>7000</td>
                    <td rowspan="2">3 Months</td>
                </tr>
                <tr>
                    <td>JavaScript</td>
                    <td>10000</td>
                    
                </tr>
            </tbody>
        
    </table>
</body>
</html>
