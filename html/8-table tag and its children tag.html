<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table tag</title>
</head>
<body>
    <table border="2px" align="center" width="500px" height="500px">
        <thead>
            <tr>
            <th>Course</th>
            <th>Fees</th>
            <th>Duration</th>
            </tr>
        </thead>
            <tbody>
                <tr>
                    <td>HTML</td>
                    <td>5000</td>
                    <td>2 Months</td>
                </tr>
                <tr>
                    <td>CSS</td>
                    <td>7000</td>
                    <td>3 Months</td>
                </tr>
                <tr>
                    <td>JavaScript</td>
                    <td>10000</td>
                    <td>3.5 Months</td>
                </tr>
            </tbody>
        
    </table>
</body>
</html>
