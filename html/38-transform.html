<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform</title>
    <style>
        div{
            width: 500px;
            height: 500px;
            background-color: brown;
            border: 2px solid blueviolet;
            /* translate(x,y): function jo hy wo 2 arguments leta hy yh margin ki trah work krta hy but margin space leta hy ; */
            transform: translate(100px,100px);
        }
    </style>
</head>
<body>
    <div>
        
    </div>
</body>
</html>
